# Rime schema
# encoding: utf-8
#
# 键道・函流
# 键道（KeyTao）的「流」移植版：原版码表转换 + 冰/袖珍词库（数据来自 KeyTao 仓库）

schema:
  schema_id: keytao_flow
  name: 键道・函流
  version: "1.0"
  description: |
    键道（KeyTao）的「流」方案
    原版码表转换 + 冰/袖珍词库，候选按权重自动排码
    支持 ` 键自主造词和 - = 键自主调频
    顶功逻辑不变
  author:
    - TsFreddie

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, 西 ]
  - name: full_shape
    states: [ 半, 全 ]
  - name: jffh
    reset: 0
    states: [ 简, 繁 ]

engine:
  processors:
    - ascii_composer
    - key_binder
    - lua_processor@*flow_shape
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - lua_filter@*flow_filter
    - simplifier@jffh
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz"

translator:
  # 词库：keytao_flow.keytao（键道原版码表）| keytao_flow.ice（雾凇拼音）| keytao_flow.simp（袖珍简化字）
  dictionary: keytao_flow.keytao
  enable_user_dict: false
  enable_sentence: false
  enable_completion: false
  enable_encoder: false
  enable_charset_filter: false

# 引擎（flow_engine_lua）需要的键位表 —— 两套方案的差异主要在这两个字母表
flow_engine:
  sound_keys: "bcdefghjklmnpqrstwxyz"   # 键道6 声母键
  shape_keys: "aiouv"    # 键道6 笔形键
  # 动作键（- / =）：正常模式调序，造词/声笔调整模式做对应动作
  # 翻页键（[ / ]）：能翻就翻，到头按 page_edge 处理
  bindings:
    promote: minus       # 调序上调 / 造词入库 / 声笔设为 sb
    demote: equal        # 降档延长 / 造词删除 / 声笔设为 sbb
    prev_page: bracketleft    # 上一页
    next_page: bracketright   # 下一页
  # 翻页到头（第一页再往前 / 最后一页再往后）：
  # ignore 吞掉 | topup 顶屏（当前内容上屏）| pass 交给后面的处理器（[ 出「）
  page_edge: topup

# 调序与造词引擎数据库
flow_order:
  # 存储后端：leveldb（默认，高性能）| txt（纯文本，方便调试与手动修改）
  backend: leveldb
  name: keytao_flow.order

# 候选提示：非首选候选右侧显示「让它成为首选还需要按的键」
# （声码未输完补声码，输完则给形码；候选按这个键数稳定排序）
flow_hint:
  # 笔码（形码）提示
  shape: true
  # 不可顶功提示（⛔️）
  topup: true
# 全关用 flow_hint: false（关了提示也就不排序）

# 次简（原版「二重」）：候选第 2 位标 🔹，Tab 上屏/学习；
# 设为 false 整块关掉（Tab 不处理、不显示次简候选、不学习）
flow_secondary: false   # 键道6 次选走 smart_2 撇号，本移植不做 Tab 次简

jffh:
  opencc_config: s2t.json
  option_name: jffh

punctuator:
  full_shape:
    ' ' : { commit: '　' }
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    '?' : { commit: ？ }
    '/' : { commit: / }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '\' : [ 、, ＼ ]
    '|' : [ ·, ｜, '§', '¦' ]
    '`' : ｀
    '~' : ～
    '!' : { commit: ！ }
    '@' : ＠
    '#' : ＃
    '%' : [ ％, '°', '℃' ]
    '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤' ]
    '^' : { commit: …… }
    '&' : ＆
    '*' : [ ＊, ·, ・, ×, ※, ❂ ]
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
  half_shape:
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    '?' : { commit: ？ }
    '/' : { commit: / }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '\' : [ 、, '\', ＼ ]
    '|' : [ ·, '|', ｜, '§', '¦' ]
    '`' : '`'
    '~' : [ '~', ～ ]
    '!' : { commit: ！ }
    '@' : '@'
    '#' : '#'
    '%' : [ '%', ％, '°', '℃' ]
    '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤' ]
    '^' : { commit: …… }
    '&' : '&'
    '*' : [ '*', ＊, ·, ・, ×, ※, ❂ ]
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕,  ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]

key_binder:
  bindings:
    - {when: always, accept: F6, select: .next }
    - {when: always, accept: F7, toggle: jffh }
    # [ ] 翻页交给引擎（flow_engine/bindings/prev_page / next_page）：
    # 引擎要先看到按键，才能「翻不动了就顶屏」（flow_engine/page_edge）
